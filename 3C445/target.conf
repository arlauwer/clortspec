# Settings for reduction/xmm_reduce.sh (sourced by bash).

TARGET="3C 445"
OBSID=0884000101
RA=335.9570833
DEC=-2.1036111

# Extraction regions in sky (X,Y) physical pixels (1 px = 0.05 arcsec). Sky
# coordinates are common to all EPIC cameras, so MOS1 and MOS2 share the MOS
# regions. pn is in small-window mode (only CCD 4), so its background sits in
# the window. MOS is in partial-window mode (central CCD = 110" window), so the
# MOS background is on the outer CCDs, at a spot that is live in both cameras
# (MOS1 has lost CCDs 3 and 6).
PN_SRC="circle(27693.547, 27077.69, 648.0083)"
PN_BKG="circle(26143.093, 25850.248, 1092.3203)"
MOS_SRC="circle(27675.709,27079.869,866.52242)"
MOS_BKG="circle(37300,26300,2500)"

# Soft-proton flare filtering: maximum count rate (cts/s, 100 s bins) of the
# single-event light curve above 10 keV, per camera. Check reduction/lightcurves.png.
PN_RATE_MAX=0.4
MOS_RATE_MAX=0.35
